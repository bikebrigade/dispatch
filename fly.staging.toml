app = "bike-brigade-staging"
# Next to the staging database (Fly Managed Postgres in Toronto)
primary_region = "yyz"

kill_signal = "SIGTERM"
kill_timeout = 5

[env]
  APP_ENV = "staging"

[deploy]
  release_command = "/app/bin/bike_brigade eval BikeBrigade.Release.migrate"

[experimental]
  allowed_public_ports = []
  auto_rollback = true

[[services]]
#  http_checks = []
  internal_port = 4000
  protocol = "tcp"
#  script_checks = []

  # Sleep when nobody's using staging; the first request wakes it. Its Managed
  # Postgres (Developer plan) then pauses once the app's connections close.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [services.concurrency]
    hard_limit = 25
    soft_limit = 20
#    type = "connections"

  [[services.ports]]
    handlers = ["http"]
    port = 80

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

  [[services.tcp_checks]]
    grace_period = "30s" # allow some time for startup
    interval = "15s"
    restart_limit = 6
    timeout = "2s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"

[metrics]
port = 4021
path = "/metrics"